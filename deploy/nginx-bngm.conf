# Nginx reverse proxy for the JW BNGM Tracker.
# Put this at /etc/nginx/sites-available/bngm on the Hostinger VPS, then:
#   sudo ln -s /etc/nginx/sites-available/bngm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After it works over http, get free HTTPS with:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d bngm.yourdomain.com
# Certbot rewrites this file to add the SSL block and an http→https redirect.

server {
    listen 80;
    server_name bngm.yourdomain.com;   # <-- change to your domain or the VPS IP

    # Proxy everything to the Node app (PORT in .env, default 3000).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 4m;   # matches the app's 2mb JSON limit, with headroom
}
